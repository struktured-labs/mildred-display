<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Car Display</title>
<style>
body{margin:0;background:#000;color:#f2f2f2;font:22px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:880px;margin:0 auto;padding:16px}
#status{color:#9ab;font-size:18px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
#status.err{color:#ff8a80}
.card{background:#151a20;border:2px solid #2c3540;border-radius:14px;padding:16px 18px;margin:12px 0}
.hero{border-color:#4fc3f7;background:#0d1b26}
.hero h2{font-size:38px;margin:4px 0 8px}
h3{font-size:26px;margin:0 0 4px}
.meta{color:#9ab;font-size:17px}
.body{margin:6px 0;white-space:pre-wrap;word-wrap:break-word}
a.btn{display:inline-block;margin-top:8px;padding:12px 20px;background:#4fc3f7;color:#000;font-weight:700;border-radius:10px;text-decoration:none;font-size:22px;word-break:break-all}
#lock{text-align:center;margin-top:30vh;font-size:34px;color:#888}
</style></head><body><main>
<div id="status"><span id="upd">Loading…</span><span id="chk"></span></div>
<div id="app"></div>
</main>
<script>
const OWNER='struktured-labs',REPO='mildred-display',PATH='feed.json',POLL=90000;
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}?ref=main`;
const tz={timeZone:'America/New_York',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'};
const fmt=t=>new Date(t).toLocaleString('en-US',tz)+' ET';
const token=decodeURIComponent(location.hash.slice(1));
const $=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:null;
let keyCache={},lastSha=null,timer=null;
async function key(salt){const k=salt;if(keyCache[k])return keyCache[k];
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(token),'PBKDF2',false,['deriveKey']);
 return keyCache[k]=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(salt),iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);}
async function decrypt(env){const k=await key(env.salt);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(env.iv)},k,b64(env.ct));
 return JSON.parse(new TextDecoder().decode(pt));}
function card(it,hero){const u=safeUrl(it.url);
 return `<div class="card${hero?' hero':''}">${hero?'<h2>':'<h3>'}${esc(it.title)}${hero?'</h2>':'</h3>'}
 ${it.body?`<div class="body">${esc(it.body)}</div>`:''}
 <div class="meta">${esc(fmt(it.ts))}${it.from?' · '+esc(it.from):''}</div>
 ${u?`<a class="btn" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Open ${esc(new URL(u).hostname)}</a>`:''}</div>`;}
async function poll(){clearTimeout(timer);
 try{const r=await fetch(API,{cache:'no-cache'});
  if(!r.ok)throw new Error('HTTP '+r.status+(r.status==403?' (rate limited)':''));
  const j=await r.json();
  if(j.sha!==lastSha){const env=JSON.parse(new TextDecoder().decode(b64(j.content)));
   const feed=await decrypt(env);const items=(feed.items||[]).slice(0,11);
   $('app').innerHTML=items.length?card(items[0],true)+items.slice(1).map(i=>card(i,false)).join(''):'<div class="card">No items yet.</div>';
   $('upd').textContent='Last updated: '+(feed.updated?fmt(feed.updated):'—');lastSha=j.sha;}
  $('status').className='';$('chk').textContent='Checked '+fmt(Date.now());
 }catch(e){$('status').className='err';$('chk').textContent='Error: '+(e.name==='OperationError'?'wrong token':e.message)+' · retrying';}
 timer=setTimeout(poll,POLL);}
if(!token||!crypto.subtle){$('status').style.display='none';$('app').innerHTML='<div id="lock">🔒 Locked</div>';}
else{poll();document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll();});
 addEventListener('online',poll);addEventListener('pageshow',e=>{if(e.persisted)poll();});}
</script></body></html>
